version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: efstr_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api # Uses lightweight image
    container_name: efstr_api
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATABASE_URL=sqlite:////workspace/jobs.db
    volumes:
      - shared-data:/workspace
      - c:/Users:/Users
      - c:/Users:/c/Users
      - .:/workspace
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker # Uses PyTorch CUDA image
    container_name: efstr_worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - API_URL=http://api:8000
    command: python worker.py
    volumes:
      - shared-data:/workspace
      - c:/Users:/Users
      - c:/Users:/c/Users
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  shared-data:
