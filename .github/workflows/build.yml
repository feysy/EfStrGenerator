name: Build & Release Multiplatform Executables

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Binary with PyInstaller
        run: |
          python build_app.py
          cd dist
          powershell Compress-Archive -Path EfStrGenerator -DestinationPath EfStrGenerator-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EfStrGenerator-Windows-x64
          path: dist/EfStrGenerator-Windows-x64.zip

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 \
            libglu1-mesa \
            appstream \
            squashfs-tools

          # Download appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_linux.txt

      - name: Build Linux Binary with PyInstaller
        run: |
          python build_app.py

      - name: Create AppImage Structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/EfStrGenerator/* AppDir/usr/bin/
          
          # Create AppRun launcher
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/EfStrGenerator" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create Desktop Entry
          cat << 'EOF' > AppDir/EfStrGenerator.desktop
          [Desktop Entry]
          Type=Application
          Name=EfStrGenerator
          Exec=EfStrGenerator
          Icon=efstrgenerator
          Categories=AudioVideo;AudioVideoEditing;
          EOF

          # Create dummy icon if none exists
          convert -size 256x256 xc:blue AppDir/efstrgenerator.png || touch AppDir/efstrgenerator.png

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          appimagetool AppDir EfStrGenerator-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EfStrGenerator-Linux-AppImage
          path: EfStrGenerator-x86_64.AppImage

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Nvidia PyIndex
        continue-on-error: true
        run: |
          pip install nvidia-pyindex --no-build-isolation

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://pypi.ngc.nvidia.com -r requirements.txt

      - name: Build macOS Application with PyInstaller
        run: |
          python build_app.py
          cd dist
          zip -r EfStrGenerator-macOS.zip EfStrGenerator

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EfStrGenerator-macOS
          path: dist/EfStrGenerator-macOS.zip

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-appimage, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: EfStrGenerator-Windows-x64
          path: ./release-assets

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: EfStrGenerator-Linux-AppImage
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: EfStrGenerator-macOS
          path: ./release-assets

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
